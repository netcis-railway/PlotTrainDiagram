[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redams"
version = "0.1.0"
description = "Railway timetable analysis and document management"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1",
  "PyYAML>=6,<7", "duckdb>=1.1,<3", "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
